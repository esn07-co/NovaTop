/* ==========================================================================
   AUTHENTICATION & USER PROFILE STYLES
   ========================================================================== */

/* Navigation Sign In & User Profile */
.signin-btn {
  background: linear-gradient(110deg, #6366f1, #818cf8);
  color: #ffffff;
  border: 0;
  border-radius: 9px;
  padding: 8px 18px;
  font: 700 14px 'DM Sans', sans-serif;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(99, 102, 241, 0.28);
  transition: transform 0.2s ease, filter 0.2s ease;
}

.signin-btn:hover {
  transform: translateY(-1px);
  filter: brightness(1.1);
}

.user-profile-menu-wrap {
  position: relative;
}

.user-avatar-btn {
  background: #151a26;
  border: 1px solid var(--line);
  border-radius: 99px;
  padding: 4px 12px 4px 5px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: #fff;
  cursor: pointer;
  transition: all 0.2s ease;
}

.user-avatar-btn:hover {
  border-color: #7659ff;
  background: #1c2233;
}

.user-avatar-circle {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: linear-gradient(135deg, #6366f1, #a855f7);
  display: grid;
  place-items: center;
  font: 700 12px Outfit, sans-serif;
  color: #fff;
}

.user-avatar-circle.large {
  width: 44px;
  height: 44px;
  font-size: 18px;
  flex-shrink: 0;
}

.user-name-label {
  font-weight: 600;
  font-size: 13px;
  max-width: 100px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.user-dropdown-arrow {
  font-size: 11px;
  color: var(--muted);
}

.user-dropdown-popover {
  position: absolute;
  top: calc(100% + 10px);
  right: 0;
  width: 260px;
  background: #111522;
  border: 1px solid #2d3650;

// Auth State & Persistence
const AUTH_STORAGE_KEY = 'novatop_auth_session';

function getStoredUser() {
  try {
    const data = localStorage.getItem(AUTH_STORAGE_KEY);
    return data ? JSON.parse(data) : null;
  } catch (e) {
    return null;
  }
}

function setStoredUser(user) {
  try {
    if (user) {
      localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify(user));
    } else {
      localStorage.removeItem(AUTH_STORAGE_KEY);
    }
  } catch (e) {
    console.error('Storage error', e);
  }
}

let currentUser = getStoredUser();
let authModalState = {
  isOpen: false,
  view: 'signin', // 'signin' | 'signup' | 'forgot' | 'google_chooser' | 'forgot_success'
  emailInput: '',
  error: '',
  isSubmitting: false
};

  { id: 'mlbb', name: 'Mobile Legends', short: 'ML', type: 'Diamonds', color: 'violet', art: '✦', poster: '/assets/mobile-legends-poster.jpg', desc: 'Official diamonds, delivered in minutes.' },
  { id: 'bgmi', name: 'BGMI', short: 'BG', type: 'UC', color: 'orange', art: '◈', poster: '/assets/bgmi-poster.jpg', desc: 'Recharge UC securely with your player ID.' }
];

const packages = {
  mlbb: [[86, 149], [172, 279], [257, 399], [344, 529], [514, 749], [706, 999]],
  bgmi: [[60, 79], [300, 369], [600, 719], [1500, 1749], [3000, 3399], [6000, 6499]]
};

  shield: '◈',
  bolt: 'ϟ',
  clock: '◷',
  arrow: '→',
  search: '⌕',
  check: '✓',
  menu: '☰',
  close: '×',
  copy: '⧉',
  user: '👤',
  logout: '⎋'
}[name] || '•');

function showToast(message, type = 'info') {
  let toastContainer = document.querySelector('.toast-container');
  if (!toastContainer) {
    toastContainer = document.createElement('div');
    toastContainer.className = 'toast-container';
    document.body.appendChild(toastContainer);
  }
  const toast = document.createElement('div');
  toast.className = `toast-pill ${type}`;
  toast.innerHTML = `<span class="toast-icon">${type === 'success' ? '✓' : type === 'error' ? '✕' : 'ℹ'}</span><span>${message}</span>`;
  toastContainer.appendChild(toast);
  setTimeout(() => toast.classList.add('show'), 10);
  setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(() => toast.remove(), 300);
  }, 3500);
}

  authModalState = {
    isOpen: true,
    view,
    emailInput: authModalState.emailInput || '',

  };
  userMenuOpen = false;
  renderAuthModal();
}

function closeAuthModal() {
  authModalState.isOpen = false;
  renderAuthModal();
  if (location.hash === '#signin' || location.hash === '#signup' || location.hash === '#forgot-password') {
    history.replaceState(null, '', '#home');
  }
}

window.closeAuthModal = closeAuthModal;

window.toggleUserMenu = function (e) {
  if (e) e.stopPropagation();
  userMenuOpen = !userMenuOpen;
  render();
};

  if (e) e.stopPropagation();

function bindAuthModalEvents() {
  const backdrop = document.querySelector('#authBackdrop');
  backdrop?.addEventListener('click', (e) => {
    if (e.target === backdrop) closeAuthModal();
  });

  document.querySelector('#authCloseBtn')?.addEventListener('click', closeAuthModal);

  document.querySelector('#googleSelectDefault')?.addEventListener('click', () => {
    currentUser = {
      name: 'Ishan Luwang',
      email: 'ishanluwang@gmail.com',
      avatar: 'https://api.dicebear.com/7.x/bottts/svg?seed=Ishan',
      provider: 'google'
    };
    setStoredUser(currentUser);
    closeAuthModal();
    render();
    showToast(`Signed in as ${currentUser.name}`, 'success');
  });

  document.querySelector('#googleUseAnother')?.addEventListener('click', () => {
    const inputArea = document.querySelector('#customGoogleInputArea');
    if (inputArea) {
      inputArea.style.display = inputArea.style.display === 'none' ? 'block' : 'none';
      document.querySelector('#customGoogleEmail')?.focus();
    }
  });

  document.querySelector('#submitCustomGoogle')?.addEventListener('click', () => {
    const email = document.querySelector('#customGoogleEmail')?.value.trim();
    if (!email || !email.includes('@')) {
      alert('Please enter a valid Google email address.');
      return;
    }
    const namePart = email.split('@')[0];
    const formattedName = namePart.charAt(0).toUpperCase() + namePart.slice(1);
    currentUser = {
      name: formattedName,
      email: email,
      avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(email)}`,
      provider: 'google'
    };
    setStoredUser(currentUser);
    closeAuthModal();
    render();
    showToast(`Signed in as ${currentUser.name}`, 'success');
  });

  document.querySelector('#resendResetBtn')?.addEventListener('click', () => {
    showToast(`Reset link resent to ${authModalState.emailInput}`, 'success');
  });

  // Form submits
  document.querySelector('#signinForm')?.addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.querySelector('#signinEmail')?.value.trim();
    const password = document.querySelector('#signinPassword')?.value;

    if (!email || !password) return;

    authModalState.isSubmitting = true;
    renderAuthModal();

    setTimeout(() => {
      const namePart = email.split('@')[0];
      const displayName = namePart.charAt(0).toUpperCase() + namePart.slice(1);
      currentUser = {
        name: displayName,
        email: email,
        avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(email)}`,
        provider: 'email'
      };
      setStoredUser(currentUser);
      closeAuthModal();
      render();
      showToast(`Welcome back, ${currentUser.name}!`, 'success');
    }, 600);
  });

  document.querySelector('#signupForm')?.addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.querySelector('#signupName')?.value.trim();
    const email = document.querySelector('#signupEmail')?.value.trim();
    const password = document.querySelector('#signupPassword')?.value;

    if (!name || !email || !password) return;

    authModalState.isSubmitting = true;
    renderAuthModal();

    setTimeout(() => {
      currentUser = {
        name: name,
        email: email,
        avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(email)}`,
        provider: 'email'
      };
      setStoredUser(currentUser);
      closeAuthModal();
      render();
      showToast(`Account created! Welcome, ${currentUser.name}`, 'success');
    }, 600);
  });

  document.querySelector('#forgotPasswordForm')?.addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.querySelector('#forgotEmail')?.value.trim();
    if (!email) return;

    authModalState.isSubmitting = true;
    authModalState.emailInput = email;
    renderAuthModal();

    setTimeout(() => {
      authModalState.isSubmitting = false;
      authModalState.view = 'forgot_success';
      renderAuthModal();
    }, 700);
  });
}

      <div class="faq">${[['How long does a top-up take?', 'Most orders are confirmed within a few minutes. You can follow its progress with your order number.'], ['What if I enter the wrong player ID?', 'Orders are sent to the player details you provide, so please check them before payment.'], ['Can I get a refund?', 'This demo does not process payments. A live service should publish a clear refund policy.'], ['How can I contact support?', 'Use the form below and our friendly team will get back to you.']].map(([q, a]) => `<details><summary>${q}<span>+</span></summary><p>${a}</p></details>`).join('')}</div>
      <form id="contactForm" class="contact-form">
        <h2>Still need a hand?</h2>
        <div class="form-grid"><label>Name<input required placeholder="Your name" /></label><label>Email<input type="email" required placeholder="you@example.com" /></label></div>
        <label>How can we help?<textarea required placeholder="Include your order number if you have one."></textarea></label>
        <button class="btn primary">Send message ${icon('arrow')}</button>
        <p id="formMessage"></p>
      </form>
    </section>
  </main>`;
}

function walletPage() {
  return `<main class="center-page">
    <section class="wallet-card">
      <p class="eyebrow">NOVA WALLET</p>
      <h1>₹${wallet.toFixed(2)}</h1>
      <p>Your demo wallet balance</p>
      <div class="amounts">${[100, 500, 1000, 2000].map(n => `<button data-add="${n}">+ ₹${n}</button>`).join('')}</div>
      <label>Or enter an amount<input id="customAmount" inputmode="numeric" placeholder="0" /></label>
      <button id="addBalance" class="btn primary full">Add demo balance ${icon('arrow')}</button>
      <div class="notice">${icon('shield')} This is a front-end demo. No money is collected or stored.</div>
    </section>
  </main>`;
}

function render() {
  const route = location.hash.slice(1) || 'home';
  if (route === 'signin' || route === 'signup' || route === 'forgot-password') {
    openAuthModal(route === 'forgot-password' ? 'forgot' : route);
  }
  let content = route.startsWith('topup/') ? topup(route.split('/')[1]) : ({ home, games: home, track, help, wallet: walletPage, signin: home, signup: home, 'forgot-password': home }[route] || home)();
  app.innerHTML = header() + content + footer();
  bind();
  if (route === 'games') requestAnimationFrame(() => document.querySelector('#games')?.scrollIntoView());
  else window.scrollTo({ top: 0, behavior: 'instant' });
}

function bind() {
  document.querySelector('#walletButton')?.addEventListener('click', () => location.hash = 'wallet');

  // Close dropdown on outside click
  window.addEventListener('click', (e) => {
    if (userMenuOpen && !e.target.closest('.user-profile-menu-wrap')) {
      userMenuOpen = false;
      render();
    }
  }, { once: true });

  document.querySelector('#menuButton')?.addEventListener('click', () => document.querySelector('nav').classList.toggle('open'));
  document.querySelector('#gameSearch')?.addEventListener('input', e => document.querySelectorAll('.game-card').forEach(c => c.hidden = !c.dataset.game.includes(e.target.value.toLowerCase())));
  document.querySelector('#verifyPlayer')?.addEventListener('click', () => { const id = document.querySelector('#playerId').value.trim(); document.querySelector('#verifiedName').textContent = id ? `${icon('check')} Player details verified — ShadowRider` : 'Enter a player ID to verify.'; });
  document.querySelectorAll('.pack').forEach(btn => btn.addEventListener('click', () => { document.querySelectorAll('.pack').forEach(x => x.classList.remove('selected')); btn.classList.add('selected'); selectedPackage = btn.dataset; document.querySelector('#summaryPack').textContent = `${selectedPackage.amount} ${games.find(g => g.id === currentGame).type}`; document.querySelector('#summaryPrice').textContent = `₹${selectedPackage.price}`; document.querySelector('#summaryTotal').textContent = `₹${selectedPackage.price}`; document.querySelector('#continuePayment').disabled = false; }));
  document.querySelector('#continuePayment')?.addEventListener('click', () => { const player = document.querySelector('#playerId').value.trim(); if (!player) { document.querySelector('#playerId').focus(); return; } alert(`Demo order created for ${selectedPackage.amount} ${games.find(g => g.id === currentGame).type}. No payment will be taken.`); location.hash = 'track'; });
  document.querySelector('#trackOrder')?.addEventListener('click', () => { const code = document.querySelector('#orderNumber').value.trim(); document.querySelector('#trackingResult').innerHTML = code ? `<div class="tracking"><span>${icon('check')}</span><div><b>Order found</b><p>Payment pending · We’ll begin processing after payment confirmation.</p></div></div>` : '<p class="error">Please enter an order number.</p>'; });
  document.querySelector('#contactForm')?.addEventListener('submit', e => { e.preventDefault(); document.querySelector('#formMessage').textContent = 'Thanks — your demo support request has been recorded.'; e.target.reset(); });
  document.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => { document.querySelector('#customAmount').value = b.dataset.add; }));
  document.querySelector('#addBalance')?.addEventListener('click', () => { const n = Number(document.querySelector('#customAmount').value); if (n > 0) { wallet += n; render(); } });
}

// Global escape key to close modals
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && authModalState.isOpen) {
    closeAuthModal();
  }
});

window.addEventListener('hashchange', render);
render();

    </script>
  </body>
</html>
